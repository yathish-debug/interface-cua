<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Employee Automation Console{% endblock %}</title>

  <style>
    :root {
      --navy: #102a43;
      --blue: #1976d2;
      --green: #18864b;
      --amber: #a55c00;
      --red: #b42318;
      --bg: #f4f7fb;
      --card: #ffffff;
      --border: #d9e2ec;
      --text: #243b53;
      --muted: #627d98;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      padding: 18px 32px;
      background: var(--navy);
      color: white;
    }

    header a {
      color: white;
      text-decoration: none;
    }

    main {
      max-width: 1100px;
      margin: 32px auto;
      padding: 0 20px;
    }

    h1, h2, h3 { margin-top: 0; }

    .card {
      margin-bottom: 20px;
      padding: 22px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .muted { color: var(--muted); }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .badge-waiting { color: #7a3e00; background: #fff3cd; }
    .badge-complete { color: #0d5c31; background: #dff6e8; }
    .badge-neutral { color: #334e68; background: #e6eef6; }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 13px;
    }

    .button {
      display: inline-block;
      padding: 10px 14px;
      border: 0;
      border-radius: 6px;
      color: white;
      background: var(--blue);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }

    .approve { background: var(--green); }
    .manual { background: var(--amber); }
    .abort { background: var(--red); }

    input, textarea, select {
      width: 100%;
      margin: 6px 0 14px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
    }

    textarea { min-height: 90px; }

    .timeline-item {
      margin: 10px 0;
      padding: 12px;
      border-left: 4px solid var(--blue);
      background: #f8fbff;
    }

    .screenshot {
      max-width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <header>
    <a href="/">
      <strong>MidState CU — Employee Automation Console</strong>
    </a>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
